<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moje kalendarze</title><link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script></head><body class="admin-body"><header class="topbar"><a class="brand" href="/">♡ <span>Umówmy się</span></a><a class="admin-link" href="/">Rezerwacje</a></header><main class="admin-wrap"><section class="hero compact"><p class="eyebrow">STREFA WŁAŚCICIELI</p><h1>Moje <em>kalendarze.</em></h1><p class="muted">Spotkania i uprawnienia przydzielone przez administratora.</p></section><section class="panel" id="ownerLogin"><h2>Logowanie</h2><form id="ownerLoginForm" class="stack"><label>Login<input id="ownerUsername" autocomplete="username" required></label><label>Hasło<input id="ownerPassword" type="password" autocomplete="current-password" required></label><button class="primary">Zaloguj się</button><p id="ownerLoginStatus" class="status"></p></form></section><div id="ownerDash" class="hidden"><div class="admin-actions"><span id="ownerWelcome"></span><button class="secondary" id="ownerLogout">Wyloguj</button></div><section class="panel"><h2>Kalendarz spotkań</h2><label>Profil <select id="ownerProfile"><option value="">Wszystkie przydzielone</option></select></label><div class="calendar-toolbar admin-toolbar"><button class="icon-btn" id="ownerPrev">‹</button><h3 id="ownerMonth"></h3><button class="icon-btn" id="ownerNext">›</button><div class="view-switch"><button data-owner-view="month" class="active">Miesiąc</button><button data-owner-view="week">Tydzień</button><button data-owner-view="day">Dzień</button></div></div><div id="ownerCalendar" class="calendar admin-calendar"></div><div id="ownerEvents" class="event-list"></div><p id="ownerCalendarStatus" class="status"></p></section><section class="panel" id="ownerBlockSection"><h2>Zablokuj termin</h2><form id="ownerBlockForm" class="stack"><label>Profil<select id="ownerBlockProfile"></select></label><label>Data<input id="ownerBlockDate" type="date" required></label><label>Godzina (puste = cały dzień)<input id="ownerBlockTime" type="time" step="900"></label><label>Powód<input id="ownerBlockReason" maxlength="200"></label><button class="primary">Dodaj blokadę</button><p id="ownerBlockStatus" class="status"></p></form></section></div></main><script src="/owner.js"></script></body></html>
